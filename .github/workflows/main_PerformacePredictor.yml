# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - PerformacePredictor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://textcodeayraxx.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_b5dc17a675cb4260b833b1112f6a3cc5 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_f8bd51f415d9423e85e37d6cf7adf90a }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: textcodeayraxx.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b5dc17a675cb4260b833b1112f6a3cc5 }}/mltest:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'PerformacePredictor'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_6bf595117c0c4dc083a856f9b4479896 }}
        images: 'textcodeayraxx.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b5dc17a675cb4260b833b1112f6a3cc5 }}/mltest:${{ github.sha }}'