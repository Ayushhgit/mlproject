<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #4caf50;
        }
        p {
            margin: 20px 0;
            font-size: 1.2rem;
        }
        a {
            text-decoration: none;
            color: white;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Thank You!</h1>
    <p>Thank you for your response, {{ name }}. We will get back to you shortly!</p>
    <button onclick="location.href='/'">Go Back to Home</button>
</body>
</html>
