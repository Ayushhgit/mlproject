<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch - Machine Learning Project</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Dark Theme Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #BB86FC;
            font-size: 2.5rem;
        }

        .contact-section {
            margin-bottom: 40px;
            text-align: center;
        }

        h2 {
            color: #03DAC5;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        form {
            background-color: #333;
            padding: 30px;
            border-radius: 8px;
            width: 50%;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        label {
            color: #BB86FC;
            font-size: 1.2rem;
            margin-bottom: 8px;
            display: block;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #BB86FC;
            border-radius: 4px;
            background-color: #121212;
            color: #E0E0E0;
            font-size: 1rem;
        }

        input[type="submit"] {
            background-color: #03DAC5;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #121212;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #018786;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 1rem;
            color: #BB86FC;
        }
    </style>
</head>
<body>
    <header>
        <h1>Get in Touch</h1>
    </header>

    <section class="contact-section">
        <h2>Contact Us</h2>
        <p>If you have any questions or feedback, feel free to reach out to us using the form below:</p>

        <form action="/contact.html" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Your Name">
        
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Your Email">
        
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required placeholder="Your Message"></textarea>
        
            <input type="submit" value="Send Message">
        </form>        
    </section>

    <footer>
        <p>&copy; 2025 Machine Learning Project | All Rights Reserved</p>
    </footer>
</body>
</html>
